{% extends 'app/dashboard_base.html' %}

{% block title %}Editar grup{% endblock %}

{% block content %}
<div class="dashboard-page">
    <div class="section">
        <a href="{% url 'app:task_group_list' %}" class="back-link">← Tornar als grups</a>

        <div class="form-card episode-form">
            <h1>Editar grup «{{ group.name }}»</h1>

            <form method="post">
                {% csrf_token %}
                <div class="form-group{% if form.name.errors %} has-error{% endif %}">
                    <label for="{{ form.name.id_for_label }}">{{ form.name.label }}</label>
                    {{ form.name }}
                </div>
                <div class="form-group{% if form.color.errors %} has-error{% endif %}">
                    <label for="{{ form.color.id_for_label }}">{{ form.color.label }}</label>
                    {{ form.color }}
                    <span class="help-text">Qualsevol valor CSS: orange, #ff6b6b, rgb(100,200,150)…</span>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Desar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

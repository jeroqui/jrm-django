{% load task_tags %}
<div class="task-node{% if node.task.status != 'pending' %} task-done{% endif %}"
     style="padding-left: {{ node.indent_rem }}rem">
    <div class="task-item">
        {% if node.task.group %}
        <span class="task-group-badge" style="--group-color: {{ node.task.group.color }}">
            {{ node.task.group.name }}
        </span>
        {% endif %}
        <span class="task-title">{{ node.task.title }}</span>
        {% if node.task.status == 'completed' %}
        <span class="task-status-badge task-status-completed">✓</span>
        {% elif node.task.status == 'discarded' %}
        <span class="task-status-badge task-status-discarded">✗</span>
        {% endif %}
        {% if node.task.status == 'pending' %}
        <div class="task-actions">
            <form method="post" action="{% url 'app:task_complete' node.task.pk %}" class="task-action-form">
                {% csrf_token %}
                <button type="submit" class="btn-link btn-small" title="Completar">✓</button>
            </form>
            <button
                type="button"
                class="btn-link btn-small btn-secondary js-discard-trigger"
                data-task-id="{{ node.task.pk }}"
                data-task-title="{{ node.task.title }}"
                data-discard-url="{% url 'app:task_discard' node.task.pk %}"
                title="Descartar"
            >✗</button>
            <a href="{% url 'app:task_create' %}?parent={{ node.task.pk }}&date={{ node.task.scheduled_date|date:'Y-m-d' }}"
               class="btn-link btn-small btn-secondary" title="Afegir subtasca">+</a>
            <a href="{% url 'app:task_edit' node.task.pk %}" class="btn-link btn-small btn-secondary" title="Editar">···</a>
        </div>
        {% endif %}
    </div>
</div>
